[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adafedgcdr"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["torch>=2.2,<3", "numpy>=1.26,<3", "tqdm>=4.66,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*"]
